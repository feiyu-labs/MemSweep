name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install zig 0.17.1
        shell: pwsh
        run: |
          $url = 'https://ziglang.org/download/0.17.1/zig-x86_64-windows-0.17.1.zip'
          Invoke-WebRequest -Uri $url -OutFile zig.zip
          Expand-Archive zig.zip -DestinationPath zig-sdk
          "ZIG=$env:GITHUB_WORKSPACE\zig-sdk\zig-x86_64-windows-0.17.1\zig.exe" >> $env:GITHUB_ENV

      - name: Self tests
        shell: cmd
        run: build.cmd test

      - name: Build x64 + ARM64
        shell: cmd
        run: |
          rem Batch-to-batch calls must use CALL; without it the first
          rem build.cmd ends this script and arm64 never runs.
          call build.cmd release
          if errorlevel 1 exit /b 1
          call build.cmd arm64
          if errorlevel 1 exit /b 1

      - name: Package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $common = @('install.cmd', 'uninstall.cmd', 'INSTALL.txt', 'LICENSE')
          $exes = @{ 'x64' = 'dist/MemSweep.exe'; 'arm64' = 'dist/MemSweep-arm64.exe' }
          foreach ($arch in $exes.Keys) {
            $dir = "pkg-$arch"
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            # Both zips carry MemSweep.exe so install.cmd works unchanged.
            Copy-Item $exes[$arch] (Join-Path $dir 'MemSweep.exe') -Force
            Copy-Item $common $dir -Force
            $zip = "MemSweep-$tag-$arch.zip"
            Compress-Archive -Path (Join-Path $dir '*') -DestinationPath $zip -Force
            $h = (Get-FileHash $zip -Algorithm SHA256).Hash
            "$h  $zip" | Out-File "$zip.sha256" -Encoding ascii
          }

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -Name 'MemSweep-*.zip', 'MemSweep-*.zip.sha256'
          # 双语发布说明优先：docs/release-notes/<tag>.md；没有该文件才退回自动生成的 notes。
          $notes = Join-Path 'docs/release-notes' "$env:GITHUB_REF_NAME.md"
          $title = "MemSweep $env:GITHUB_REF_NAME"
          if (Test-Path $notes) {
            Write-Host "using release notes: $notes"
            gh release create $env:GITHUB_REF_NAME @files --notes-file $notes --title $title
          } else {
            Write-Host "no release notes file, falling back to generated notes"
            gh release create $env:GITHUB_REF_NAME @files --generate-notes --title $title
          }
